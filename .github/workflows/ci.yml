name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.12.4
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen repo-policy check --all --allow-plugins
      - run: uv run --frozen pre-commit validate-config
      - run: uv run --frozen pre-commit run --all-files
      - run: uv build
      - run: uv run --frozen python scripts/smoke_wheel.py
