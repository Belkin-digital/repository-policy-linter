[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "repository-policy-linter"
version = "0.5.0"
description = "Local, language-agnostic repository policy checks with explicit tool plugins"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
markdown = ["markdown-it-py==4.0.0"]

[project.scripts]
repo-policy = "repo_policy.cli:main"
repo-policy-af = "repo_policy.af:main"

[project.urls]
Homepage = "https://github.com/Belkin-digital/repository-policy-linter"
Repository = "https://github.com/Belkin-digital/repository-policy-linter"
Documentation = "https://github.com/Belkin-digital/repository-policy-linter/blob/main/README.md"
Issues = "https://github.com/Belkin-digital/repository-policy-linter/issues"

[dependency-groups]
dev = ["ruff==0.14.2", "pre-commit==4.3.0", "markdown-it-py==4.0.0", "packaging==26.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/repo_policy"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
