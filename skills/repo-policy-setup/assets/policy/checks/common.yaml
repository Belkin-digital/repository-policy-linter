version: 2
rules:
  - id: readme
    kind: required-path
    path: README.md
    type: file
  - id: data-syntax
    kind: syntax
    files: ['**/*.json', '**/*.yaml', '**/*.yml']
  - id: text-newline
    kind: final-newline
    files: ['**/*.py', '**/*.md', '**/*.yaml', '**/*.yml', '**/*.json', '**/*.txt']
    safe_fix: true
plugins: []
