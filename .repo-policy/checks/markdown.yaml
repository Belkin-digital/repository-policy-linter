version: 2
rules:
- id: markdown-dates
  kind: frontmatter
  files:
  - '**/*.md'
  exclude:
  - skills/**/SKILL.md
  keys:
  - created
  - updated
  preserve_keys:
  - created
- id: markdown-navigation
  kind: markdown-reachable
  files:
  - '**/*.md'
  roots:
  - AGENTS.md
- id: claude-shared-instructions
  kind: required-text
  files:
  - CLAUDE.md
  pattern: ^@AGENTS\.md\r?$
